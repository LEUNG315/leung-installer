name: release-gate

on:
  workflow_dispatch:
    inputs:
      run_live_matrix:
        description: "Run real live smoke matrix"
        required: true
        default: "false"
      clis:
        description: "Space-separated CLI list (default: claude codex gemini)"
        required: false
        default: "claude codex gemini"

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          bash scripts/install_tooling.sh .tools/bin
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Run release readiness
        run: bash scripts/run_release_readiness.sh
      - name: Run usable CLI validation scaffold
        run: |
          bash scripts/run_cli_usable_validation.sh --help

  live-matrix:
    if: ${{ inputs.run_live_matrix == 'true' }}
    runs-on: ubuntu-latest
    needs: release-readiness
    strategy:
      fail-fast: false
      matrix:
        cli: [claude, codex, gemini]
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl
      - name: Select requested CLI subset
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          requested=" ${{ inputs.clis }} "
          current=" ${{ matrix.cli }} "
          if [[ "$requested" == *"$current"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run live smoke for matrix CLI
        if: ${{ steps.filter.outputs.run == 'true' }}
        env:
          LEUNG_LIVE_SMOKE_URL_CLAUDE: ${{ secrets.LEUNG_LIVE_SMOKE_URL_CLAUDE }}
          LEUNG_LIVE_SMOKE_URL_CODEX: ${{ secrets.LEUNG_LIVE_SMOKE_URL_CODEX }}
          LEUNG_LIVE_SMOKE_URL_GEMINI: ${{ secrets.LEUNG_LIVE_SMOKE_URL_GEMINI }}
          LEUNG_LIVE_SMOKE_API_KEY_CLAUDE: ${{ secrets.LEUNG_LIVE_SMOKE_API_KEY_CLAUDE }}
          LEUNG_LIVE_SMOKE_API_KEY_CODEX: ${{ secrets.LEUNG_LIVE_SMOKE_API_KEY_CODEX }}
          LEUNG_LIVE_SMOKE_API_KEY_GEMINI: ${{ secrets.LEUNG_LIVE_SMOKE_API_KEY_GEMINI }}
        run: bash scripts/run_live_smoke_matrix.sh "${{ matrix.cli }}"
